# Built-in hardware catalog: known devices and the memory sizes they are sold
# in. A configured hardware profile refers to an entry by `id` and one of its
# `memory_gb` sizes, and the figures are read from here when fit is estimated.
#
# Figures are in GiB, the unit `granite-cli hardware` reports.
#
# family: the group `hardware catalog` orders and filters by, and the first
# question of `hardware setup`. Entries of one family are kept together,
# and the families appear in the order the catalog lists them.
#
# memory_kind:
#   discrete  a card with its own VRAM; `memory_gb` is the VRAM
#   unified   one pool shared by CPU and GPU; `memory_gb` is the pool and
#             `addressable_gb` the part of it the GPU can use
#   system    no accelerator; `memory_gb` is system RAM
#
# Apple `addressable_gb` is the Metal working set
# (recommendedMaxWorkingSetSize). It has been measured on a 64 GiB Mac only
# (51.84 GiB, 81%). The other Apple sizes use the same 81% and are not
# measured.

- id: apple-m4
  name: Apple M4
  family: Apple Silicon
  vendor: Apple
  memory_kind: unified
  sizes:
    - { memory_gb: 16, addressable_gb: 12.96 }
    - { memory_gb: 24, addressable_gb: 19.44 }
    - { memory_gb: 32, addressable_gb: 25.92 }

