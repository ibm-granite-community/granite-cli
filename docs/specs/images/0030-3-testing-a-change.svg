<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="Unit tests run in CI; each part of an e2e test plan ends in its own place" font-size="12" width="760" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="plan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c2b7"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">Unit tests run in CI; each part of an e2e test plan ends in its own place</text><g fill="none" stroke="#c3c2b7" stroke-width="1.25"><path d="M108.5 96V128" marker-end="url(#plan-arrow)"></path><path d="M470.5 96V128" marker-end="url(#plan-arrow)"></path><path d="M108.5 208V272" marker-end="url(#plan-arrow)"></path><path d="M289.5 208V272" marker-end="url(#plan-arrow)"></path><path d="M470.5 208V272" marker-end="url(#plan-arrow)"></path><path d="M651.5 208V272" marker-end="url(#plan-arrow)"></path></g><g><rect x="24" y="56" width="712" height="40" rx="8" fill="none" fill-opacity="1" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="380" y="81" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">A change to granite-cli</text></g><text x="116.5" y="120" font-size="11.5" fill="#52514e">every change</text><text x="478.5" y="120" font-size="11.5" fill="#52514e">only where it adds value, per AGENTS.md</text><g><rect x="24" y="128" width="169" height="80" rx="8" fill="none" fill-opacity="1" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="36" y="152" font-size="12.5" font-weight="600" fill="#0b0b0b">Unit tests</text><text x="36" y="172" fill="#0b0b0b">Logic, with varied</text><text x="36" y="188" fill="#0b0b0b">inputs</text></g><g><rect x="205" y="128" width="531" height="80" rx="8" fill="none" fill-opacity="1" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="217" y="152" font-size="12.5" font-weight="600" fill="#0b0b0b">E2E test plan</text><text x="217" y="172" fill="#0b0b0b">Steps run against the built binary, using tests/e2e/lib.sh and fixtures</text><text x="217" y="190" fill="#0b0b0b">The coder checks their own work; the reviewer learns the UI changes</text></g><text font-size="11.5" fill="#52514e"><tspan x="297.5" y="236">automated,</tspan><tspan x="297.5" y="252">binary only</tspan></text><text font-size="11.5" fill="#52514e"><tspan x="478.5" y="236">automated,</tspan><tspan x="478.5" y="252">needs a server</tspan></text><text font-size="11.5" fill="#52514e"><tspan x="659.5" y="236">needs a person,</tspan><tspan x="659.5" y="252">or one-off</tspan></text><g><rect x="24" y="272" width="169" height="96" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="36" y="298" font-size="13" font-weight="600" fill="#0b0b0b">CI: unit</text><text x="36" y="320" fill="#0b0b0b">src/, next to the code</text><text x="36" y="336" fill="#0b0b0b">every pull request</text></g><g><rect x="205" y="272" width="169" height="96" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="217" y="298" font-size="13" font-weight="600" fill="#0b0b0b">CI: hermetic e2e</text><text x="217" y="320" fill="#0b0b0b">tests/e2e/hermetic</text><text x="217" y="336" fill="#0b0b0b">every pull request</text></g><g><rect x="386" y="272" width="169" height="96" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="398" y="298" font-size="13" font-weight="600" fill="#0b0b0b">CI: local e2e</text><text x="398" y="320" fill="#0b0b0b">tests/e2e/local</text><text x="398" y="336" fill="#0b0b0b">every pull request,</text><text x="398" y="352" fill="#0b0b0b">Ollama in Docker</text></g><g><rect x="567" y="272" width="169" height="96" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="579" y="298" font-size="13" font-weight="600" fill="#0b0b0b">Stays in the plan</text><text x="579" y="320" fill="#0b0b0b">Scripted and Manual</text><text x="579" y="336" fill="#0b0b0b">steps, a record of</text><text x="579" y="352" fill="#0b0b0b">the commit they ran on</text></g></svg>
