<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-label="Only steps that cover what unit tests cannot reach become maintained tests" font-size="13" width="760" height="512" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="life-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c2b7"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">Only steps that cover what unit tests can't reach become maintained tests</text><g fill="none" stroke="#c3c2b7" stroke-width="1.25"><path d="M224 96H240" marker-end="url(#life-arrow)"></path><path d="M400 96H510" marker-end="url(#life-arrow)"></path><path d="M320 132V180" marker-end="url(#life-arrow)"></path><path d="M416 216H510" marker-end="url(#life-arrow)"></path><path d="M320 252V300" marker-end="url(#life-arrow)"></path><path d="M420 336H486" marker-end="url(#life-arrow)"></path><path d="M610 300V244" marker-end="url(#life-arrow)"></path><path d="M610 372V428" marker-end="url(#life-arrow)"></path></g><g><rect x="32" y="68" width="192" height="56" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="128" font-weight="600" text-anchor="middle" fill="#0b0b0b"><tspan x="128" y="92">Step in an</tspan><tspan x="128" y="110">e2e test plan</tspan></text></g><g><polygon points="240,96 320,60 400,96 320,132" fill="none" stroke="#c3c2b7" stroke-width="1.25"></polygon><text x="320" y="100" text-anchor="middle" fill="#0b0b0b">Needs a person?</text></g><g><rect x="510" y="68" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="610" y="92" text-anchor="middle" font-weight="600" fill="#0b0b0b">Manual step</text><text x="610" y="110" text-anchor="middle" font-size="11.5" fill="#52514e">kept in the plan</text></g><g><polygon points="224,216 320,180 416,216 320,252" fill="none" stroke="#c3c2b7" stroke-width="1.25"></polygon><text text-anchor="middle" fill="#0b0b0b"><tspan x="320" y="212">Meets the rules in</tspan><tspan x="320" y="230">AGENTS.md?</tspan></text></g><g><rect x="510" y="188" width="200" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text x="610" y="212" text-anchor="middle" font-weight="600" fill="#0b0b0b">Test in tests/e2e</text><text x="610" y="230" text-anchor="middle" font-size="11.5" fill="#0b0b0b">CI runs it on every pull request</text></g><g><rect x="220" y="300" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="320" y="324" text-anchor="middle" font-weight="600" fill="#0b0b0b">Scripted step</text><text text-anchor="middle" font-size="11.5" fill="#52514e"><tspan x="320" y="342">output from one commit,</tspan><tspan x="320" y="358">not maintained</tspan></text></g><g><polygon points="486,336 610,300 734,336 610,372" fill="none" stroke="#c3c2b7" stroke-width="1.25"></polygon><text text-anchor="middle" fill="#0b0b0b"><tspan x="610" y="332">Found a bug, or reaches</tspan><tspan x="610" y="350">lines unit tests miss?</tspan></text></g><g><rect x="510" y="428" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#c3c2b7" stroke-width="1.25"></rect><text x="610" y="452" text-anchor="middle" font-weight="600" fill="#0b0b0b">Record of that commit</text><text x="610" y="470" text-anchor="middle" font-size="11.5" fill="#52514e">stays in the plan</text></g><text x="455" y="88" text-anchor="middle" font-size="11.5" fill="#52514e">yes</text><text x="328" y="160" font-size="11.5" fill="#52514e">no</text><text x="463" y="208" text-anchor="middle" font-size="11.5" fill="#52514e">yes</text><text x="328" y="280" font-size="11.5" fill="#52514e">no</text><text x="453" y="328" text-anchor="middle" font-size="11.5" fill="#52514e">at merge</text><text x="618" y="280" font-size="11.5" fill="#52514e">yes</text><text x="618" y="400" font-size="11.5" fill="#52514e">no</text></svg>
